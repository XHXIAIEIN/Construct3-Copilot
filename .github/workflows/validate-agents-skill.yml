name: Validate Agents Skill

on:
  push:
    branches: [main, develop]
    paths:
      - ".claude/plugins/**"
      - "scripts/**"
      - "data/schemas/**"
      - "tests/**"
      - ".github/workflows/validate-agents-skill.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".claude/plugins/**"
      - "scripts/**"
      - "data/schemas/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate skill frontmatter
        run: |
          python - << 'PY'
          from pathlib import Path
          import re, sys

          skills = sorted(Path(".claude/plugins/construct3-copilot/skills").rglob("SKILL.md"))
          if not skills:
              sys.exit("No SKILL.md files found")
          ok = True
          for p in skills:
              text = p.read_text(encoding="utf-8")
              # Support both ---\nfrontmatter\n---  and bare frontmatter (no --- delimiters)
              m = re.match(r"^---\n(.*?)\n---\n", text, flags=re.S)
              if m:
                  fm = m.group(1)
              else:
                  # Bare frontmatter: take everything before the first blank line
                  fm = text.split("\n\n", 1)[0]
              missing = [f for f in ("name:", "description:") if f not in fm]
              if missing:
                  print(f"FAIL {p}: missing {', '.join(missing)}")
                  ok = False
              else:
                  print(f"OK   {p}")
          if not ok:
              sys.exit(1)
          PY

      - name: Validate ACE schema index
        if: hashFiles('data/schemas/index.json') != ''
        run: |
          python -c "import json; json.load(open('data/schemas/index.json', encoding='utf-8')); print('ACE schema index OK')"

      - name: Smoke test skill scripts
        run: |
          python .claude/plugins/construct3-copilot/scripts/infra/health.py --brief
          # Service bridges exit 1 when offline — expected in CI
          python .claude/plugins/construct3-copilot/scripts/query/rag.py search collision || true
          python .claude/plugins/construct3-copilot/scripts/generate/clipboard_service.py health || true

      - name: Run integration tests
        run: |
          python -m pytest tests/test_service_integration.py -v
