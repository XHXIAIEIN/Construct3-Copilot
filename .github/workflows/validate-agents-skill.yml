name: Validate Agents Skill

on:
  push:
    branches: [main, develop]
    paths:
      - ".claude/plugins/**"
      - "scripts/**"
      - "data/schemas/**"
      - "tests/**"
      - ".github/workflows/validate-agents-skill.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".claude/plugins/**"
      - "scripts/**"
      - "data/schemas/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill frontmatter
        run: |
          python - << 'PY'
          from pathlib import Path
          import re
          p = Path(".claude/plugins/construct3-copilot/skills/create/SKILL.md")
          text = p.read_text(encoding="utf-8")
          m = re.match(r"^(.*?)\n---\n", text, flags=re.S)
          if not m:
              raise SystemExit("Missing YAML frontmatter in SKILL.md")
          fm = m.group(1)
          if "name:" not in fm or "description:" not in fm:
              raise SystemExit("Frontmatter must contain name and description")
          print("SKILL.md frontmatter OK")
          PY

      - name: Validate ACE schema index
        if: hashFiles('data/schemas/index.json') != ''
        run: |
          python -c "import json; json.load(open('data/schemas/index.json', encoding='utf-8')); print('ACE schema index OK')"

      - name: Smoke test skill scripts
        run: |
          python .claude/plugins/construct3-copilot/scripts/query/schema.py search collision
          python .claude/plugins/construct3-copilot/scripts/validate/output.py tests/fixtures/events_basic.json
          python .claude/plugins/construct3-copilot/scripts/infra/health.py --brief
          # Service bridges exit 1 when offline — expected in CI
          python .claude/plugins/construct3-copilot/scripts/query/rag.py search collision || true
          python .claude/plugins/construct3-copilot/scripts/generate/clipboard_service.py health || true

      - name: Run integration tests
        run: |
          python -m pytest tests/test_service_integration.py -v
