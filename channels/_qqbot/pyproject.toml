[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqbot-host"
version = "0.1.0"
requires-python = ">=3.10"
description = "QQ message transport and model host with application plugins"
dependencies = ["qq-botpy>=1.2", "openai>=1", "python-dotenv>=1", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qqbot.model_manager" = ["static/*.html"]
