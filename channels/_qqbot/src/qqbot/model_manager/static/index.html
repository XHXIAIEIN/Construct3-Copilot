<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQbot 模型</title>
<style>
:root{
  --page:#f5f4ef;--surface:#ffffff;--side:#efeee8;--hover:rgba(31,30,29,.05);--selected:rgba(31,30,29,.08);
  --text:#1f1e1d;--text2:#6b6a64;--muted:#9a9890;--border:rgba(31,30,29,.12);--border2:rgba(31,30,29,.22);
  --primary:#1f1e1d;--on-primary:#faf9f5;--accent:#2c6fd6;
  --ok:#2f6b3f;--ok-bg:#e5efe2;--warn:#8a5a00;--warn-bg:#f6ecd4;--danger:#b5402f;--danger-bg:#f8e6e2;--info:#2a5aa8;--info-bg:#e4ecf8;
  --shadow:0 8px 24px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.08);
  color-scheme:light;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);
}
@media (prefers-color-scheme:dark){:root{
  --page:#151515;--surface:#1f1e1d;--side:#1a1a19;--hover:rgba(255,255,255,.06);--selected:rgba(255,255,255,.1);
  --text:#f0efec;--text2:#a6a49c;--muted:#78766f;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);
  --primary:#f0efec;--on-primary:#151515;--accent:#6c9fec;
  --ok:#8fc49a;--ok-bg:#1f3324;--warn:#e0b45c;--warn-bg:#3a2e14;--danger:#ec8f80;--danger-bg:#3d201b;--info:#9dbcf0;--info-bg:#1d2a40;
  --shadow:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}body{margin:0;background:var(--page)}[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--border2);background:transparent;border-radius:8px;padding:5px 12px;min-height:32px;cursor:pointer;white-space:nowrap}
button:hover:enabled{background:var(--hover)}button:disabled{color:var(--muted);cursor:default}
button.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}button.primary:hover:enabled{opacity:.88;background:var(--primary)}
button.ghost{border-color:transparent}button.confirm{border-color:var(--danger);color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;min-height:34px;min-width:0}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav{background:var(--side);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:600;padding:2px 10px 14px;font-size:15px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text2);text-decoration:none}
nav a:hover{background:var(--hover)}nav a[aria-current=page]{background:var(--selected);color:var(--text)}nav a small{color:var(--muted)}
main{padding:28px 32px;max-width:960px;width:100%}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 16px;margin-bottom:16px}header>div:first-child{flex:1 1 300px;min-width:0}.tools{flex-shrink:0}
h1{font-size:22px;font-weight:500;margin:0 0 2px}.sub{color:var(--text2);font-size:13px}.muted{color:var(--muted);font-size:12px}
.status{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;margin-bottom:16px;background:var(--hover);color:var(--text2);font-size:13px}
.status[data-state=running]{background:var(--info-bg);color:var(--info)}.status[data-state=failed]{background:var(--danger-bg);color:var(--danger)}.status[data-state=completed]{background:var(--ok-bg);color:var(--ok)}
.status span{flex:1}.status button{min-height:26px;padding:2px 10px;font-size:12px}
.list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--border)}.row:first-child{border-top:0}
.row .what{flex:1;min-width:0}.row .name{font-weight:500;overflow-wrap:anywhere}.row .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .note{font-size:12px;color:var(--warn);margin-top:2px}.row .note:empty{display:none}
.badge{font-size:12px;padding:1px 8px;border-radius:6px;white-space:nowrap}.badge:empty{display:none}
.badge[data-tone=current]{background:var(--info-bg);color:var(--info)}.badge[data-tone=ok]{background:var(--ok-bg);color:var(--ok)}
.badge[data-tone=warn]{background:var(--warn-bg);color:var(--warn)}.badge[data-tone=danger]{background:var(--danger-bg);color:var(--danger)}.badge[data-tone=plain]{background:var(--hover);color:var(--text2)}
.more{border-color:transparent;padding:4px 8px;color:var(--text2);font-size:16px;line-height:1}
.empty{padding:28px 16px;text-align:center;color:var(--text2)}.empty button{margin-top:10px}
.tools{display:flex;gap:8px}.tools input{width:200px}
.menu{position:fixed;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 10px;min-height:30px}
.menu button.danger{color:var(--danger)}.menu .why{padding:2px 10px 6px;font-size:12px;color:var(--muted);max-width:240px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:20px 22px;display:flex;flex-direction:column;gap:14px}dialog h2{font-size:17px;font-weight:500;margin:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}.field>span{color:var(--text2)}.field small{color:var(--muted);font-size:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1px solid var(--border);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px}legend{padding:0 4px;color:var(--text2);font-size:13px}
.hint{font-size:12px;color:var(--warn)}.hint:empty{display:none}
.error{font-size:13px;color:var(--danger);background:var(--danger-bg);padding:8px 10px;border-radius:8px}.error:empty{display:none}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
details summary{cursor:pointer;color:var(--text2);font-size:13px}details[open] summary{margin-bottom:8px}
.facts{display:grid;grid-template-columns:140px minmax(0,1fr);gap:0}.facts>*{padding:11px 14px;border-top:1px solid var(--border)}
.facts>:nth-child(-n+2){border-top:0}.facts dt{color:var(--text2)}.facts dd{margin:0;overflow-wrap:anywhere;display:flex;justify-content:space-between;gap:8px;align-items:center}

.group{margin-bottom:20px}.group-head{display:flex;width:100%;align-items:center;gap:8px;border:0;border-radius:6px;padding:4px 4px 8px;min-height:0;font-weight:500;text-align:left}
.group-head:hover:enabled{background:transparent}.group-head small{color:var(--muted);font-weight:400}
.chev{margin-left:auto;margin-right:6px;width:7px;height:7px;border-right:1.5px solid var(--text2);border-bottom:1.5px solid var(--text2);transform:rotate(45deg);transition:transform .15s}
.group.collapsed .chev{transform:rotate(-45deg)}.group.collapsed .list{display:none}.searching .group.collapsed .list{display:block}
.check{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;white-space:nowrap}.check input,.tools .check input{width:auto;min-height:0;margin:0;padding:0;accent-color:var(--primary)}
.logwrap{position:relative}
.logbox{height:calc(100vh - 250px);min-height:300px;overflow:auto;padding:6px 0;font:12px/1.65 ui-monospace,"Cascadia Mono",Consolas,"Microsoft YaHei",monospace}
.logline{padding:0 14px 0 12px;border-left:2px solid transparent;white-space:pre-wrap;overflow-wrap:anywhere}
.logline[data-level=warn]{color:var(--warn);border-left-color:var(--warn)}
.logline[data-level=error]{color:var(--danger);background:var(--danger-bg);border-left-color:var(--danger)}
.only-issues .logline:not([data-level]){display:none}
.logbox .empty.bad{color:var(--danger)}.logbox .empty{font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;font-size:14px}
.jump{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--surface);border-color:var(--border);box-shadow:var(--shadow);font-size:13px}
.jump:hover:enabled{background:var(--surface);color:var(--text)}
.logmeta{margin-top:8px}.logmeta.bad{color:var(--danger)}
@media(max-width:720px){
  .app{grid-template-columns:1fr}nav{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border);padding:8px 12px;overflow-x:auto}
  .brand{padding:0 8px 0 0}main{padding:16px}header{flex-direction:column}header>div:first-child{flex-basis:auto}.tools,.tools input{width:100%}.pair{grid-template-columns:1fr}
  .logbox{height:calc(100vh - 290px)}.tools select{flex:1}
  .row{flex-wrap:wrap}.row .what{flex-basis:100%}.facts{grid-template-columns:1fr}.facts dd{border-top:0;padding-top:0}
}
</style>
<div class="app">
  <nav aria-label="页面">
    <div class="brand">QQbot</div>
    <a href="#models" data-page="models">模型 <small id="model-count"></small></a>
    <a href="#logs" data-page="logs">日志</a>
    <a href="#settings" data-page="settings">设置</a>
  </nav>
  <main>
    <header>
      <div><h1 id="title">模型</h1><div class="sub" id="now">正在读取状态…</div></div>
      <div class="tools" data-for="models" hidden><input id="search" type="search" placeholder="搜索模型或接口" aria-label="搜索模型或接口"><button id="api-add">添加接口</button><button id="refresh" class="ghost">刷新</button></div>
      <div class="tools" data-for="logs" hidden><select id="log-pick" aria-label="选择日志"></select><label class="check"><input type="checkbox" id="log-issues">只看警告和错误</label></div>
    </header>
    <div class="status" id="status" role="status" aria-live="polite"><span id="status-text">正在读取状态…</span><button id="status-close" hidden aria-label="关闭提示">知道了</button></div>

    <section data-page="models" id="groups" hidden>
      <div class="group" data-group="api"><button class="group-head" type="button" aria-expanded="true" aria-controls="apis">云端 API <small></small><span class="chev" aria-hidden="true"></span></button><div class="list" id="apis"></div></div>
      <div class="group" data-group="local"><button class="group-head" type="button" aria-expanded="true" aria-controls="models">本地模型 · Ollama <small></small><span class="chev" aria-hidden="true"></span></button><div class="list" id="models"></div></div>
      <div class="group" data-group="todo"><button class="group-head" type="button" aria-expanded="true" aria-controls="apis-todo">待配置 <small></small><span class="chev" aria-hidden="true"></span></button><div class="list" id="apis-todo"></div></div>
    </section>

    <section data-page="logs" hidden>
      <div class="logwrap">
        <div class="list logbox" id="log-box" tabindex="0" aria-label="日志内容"><div id="log-lines"></div></div>
        <button type="button" class="jump" id="log-jump" hidden>有新日志 · 回到底部</button>
      </div>
      <div class="muted logmeta" id="log-meta"></div>
    </section>

    <section data-page="settings" hidden>
      <dl class="list facts">
        <dt>模型服务</dt><dd><span id="ollama-state">读取中…</span><button id="start" hidden>启动 Ollama</button></dd>
        <dt>QQbot</dt><dd id="gateway-state">读取中…</dd>
        <dt id="last-answer-label">最近一次回答</dt><dd id="last-answer">—</dd>
        <dt>Ollama 地址</dt><dd id="ollama-url">—</dd>
        <dt>模型配置文件</dt><dd><code id="config">—</code></dd>
      </dl>
    </section>
  </main>
</div>

<div class="menu" id="menu" role="menu" hidden></div>

<dialog id="api-dialog" aria-labelledby="dialog-title">
  <form id="api-form" method="dialog">
    <h2 id="dialog-title">添加接口</h2>
    <div class="pair">
      <label class="field"><span>名称</span><input id="api-name" required maxlength="80" placeholder="智谱"></label>
      <label class="field"><span>模型</span><input id="api-model" maxlength="200" placeholder="glm-4.7-flash"></label>
    </div>
    <label class="field"><span>服务地址</span><input id="api-base" type="url" placeholder="https://open.bigmodel.cn/api/anthropic"></label>
    <label class="field"><span>协议</span>
      <select id="api-protocol"><option value="auto">自动识别</option><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select>
      <small>自动识别只把 api.anthropic.com 当作 Anthropic；其他服务商的 Anthropic 兼容地址请选 Anthropic。</small>
    </label>
    <fieldset>
      <legend>密钥</legend>
      <label class="field"><span>读取 .env 中的变量</span><input id="api-key-env" list="api-key-names" maxlength="128" spellcheck="false" placeholder="DEEPSEEK_API_KEY"></label>
      <div class="hint" id="key-hint"></div>
      <label class="field"><span>或填写新密钥</span><input id="api-key" type="password" autocomplete="new-password" placeholder="留空则使用上面的变量"><small>新密钥写入 .env 的 QQBOT_API_&lt;编号&gt;，并改用这个变量。</small></label>
      <datalist id="api-key-names"></datalist>
    </fieldset>
    <details>
      <summary>更多</summary>
      <label class="field"><span>手动余额标记</span><select id="api-mark"><option value="unknown">未知</option><option value="available">余额充足</option><option value="low">余额偏低</option><option value="empty">余额耗尽</option></select></label>
    </details>
    <div class="error" id="dialog-error" role="alert"></div>
    <div class="dialog-actions"><button type="button" id="api-cancel">取消</button><button type="submit" class="primary" id="api-submit">保存</button></div>
  </form>
</dialog>

<script>
const token="__PANEL_TOKEN__";
const $=id=>document.getElementById(id);
const protocols={openai:"OpenAI 兼容",anthropic:"Anthropic"},marks={available:"余额充足",low:"余额偏低",empty:"余额耗尽"};
const titles={models:"模型",logs:"日志",settings:"设置"};
// editingApi: null while the dialog is closed, "" for a new profile, else the profile id.
let state=null,job=null,lastAnswer=null,page="",busy=false,refreshing=false,lastJob="",pendingSave=false,editingApi=null,armed=null,armTimer=0,menuFor=null,dismissed="";

// Polls write only what changed, so rows, buttons and the dialog keep their identity between refreshes.
function setText(node,text){ if(node.textContent!==text)node.textContent=text; }
function setProp(node,key,value){ if(node[key]!==value)node[key]=value; }
function make(tag,className="",text=""){ const node=document.createElement(tag);if(className)node.className=className;if(text)node.textContent=text;return node; }
function sync(list,items,keyOf,create,update,empty){
  const rows=new Map();
  for(const row of [...list.children]){ if(row.dataset.key===undefined)row.remove();else rows.set(row.dataset.key,row); }
  let previous=null;
  for(const item of items){
    const key=keyOf(item);let row=rows.get(key);
    if(row)rows.delete(key);else{row=create();row.dataset.key=key;}
    update(row,item);
    const expected=previous?previous.nextSibling:list.firstChild;
    if(row!==expected)list.insertBefore(row,expected);
    previous=row;
  }
  for(const row of rows.values())row.remove();
  if(!items.length)list.append(empty());
}
function emptyState(text,buttonLabel,onClick){
  const box=make("div","empty",text);
  if(buttonLabel){const b=make("button","",buttonLabel);b.addEventListener("click",onClick);box.append(make("br"),b);}
  return box;
}
function rowSkeleton(){
  const row=make("div","row"),what=make("div","what");
  what.append(make("div","name"),make("div","sub"),make("div","note"));
  const badge=make("span","badge"),action=make("button"),more=make("button","more","⋯");
  action.type=more.type="button";more.setAttribute("aria-haspopup","menu");
  row.append(what,badge,action,more);return row;
}
function fillRow(row,{name,sub,note,badge,tone,action,actionLabel,armedLabel,moreLabel}){
  const [what,badgeNode,button,more]=row.children,[nameNode,subNode,noteNode]=what.children;
  setText(nameNode,name);setText(subNode,sub);subNode.title=sub;setText(noteNode,note||"");
  setText(badgeNode,badge||"");badgeNode.dataset.tone=tone||"plain";
  const isArmed=armed&&armed.kind===action&&armed.id===row.dataset.key;
  button.hidden=!actionLabel;setText(button,isArmed?armedLabel:actionLabel||"");setProp(button,"className",isArmed?"confirm":"");
  setProp(button,"disabled",busy);button.dataset.action=action||"";
  more.setAttribute("aria-label",moreLabel);
}

function arm(kind,id){ armed={kind,id};clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;renderAll();},5000);renderAll(); }
function armedFor(kind,id){ return armed&&armed.kind===kind&&armed.id===id; }

function isLocal(url){ try{return ["localhost","127.0.0.1","[::1]"].includes(new URL(url).hostname);}catch{return false;} }
function activeApi(){ return (state?.apis||[]).find(p=>p.active); }
function running(id){ return busy&&job&&job.model===id; }

// ---- local models
function renderLocal(){
  const online=!!state?.ollama?.online,list=state?.models||[],query=$("search").value.toLowerCase();
  const items=list.filter(m=>m.name.toLowerCase().includes(query));
  groupCount("local",query?`${items.length} / ${list.length}`:String(list.length),query&&!items.length);
  sync($("models"),items,m=>m.name,()=>{
    const row=rowSkeleton();
    row.children[2].addEventListener("click",()=>{const name=row.dataset.key;armedFor("switch",name)?(armed=null,act("switch",name)):arm("switch",name);});
    row.children[3].addEventListener("click",e=>openMenu(e.currentTarget,"local",row.dataset.key));
    return row;
  },(row,m)=>{
    const current=state.current?.model===m.name&&isLocal(state.current.base_url);
    fillRow(row,{name:m.name,sub:[m.parameter_size,m.quantization,m.size?(m.size/1e9).toFixed(1)+" GB":""].filter(Boolean).join(" · ")||"—",
      note:armedFor("switch",m.name)?"再点一次确认：会写入 .env 并重启 QQbot":"",
      badge:running(m.name)?"处理中…":current?"正在使用":m.loaded?"已加载":"",tone:running(m.name)?"plain":current?"current":"ok",
      action:"switch",actionLabel:current||!online?"":"切换",armedLabel:"确认切换",moreLabel:`${m.name} 更多操作`});
  },()=>!online?emptyState("模型服务未启动。","启动 Ollama",()=>act("start")):emptyState("本机还没有已安装的模型。检查设置里的模型配置文件。"));
}

// ---- API profiles
function missing(p){ return [!p.has_key&&"密钥",!p.model&&"模型",!p.base_url&&"服务地址"].filter(Boolean); }
// One plain sentence per problem; the 待配置 group header already says these profiles cannot be used yet.
function apiProblem(p){
  const alt=p.key_alternatives?.[0];
  if(!p.has_key)return {text:alt?`密钥在 ${alt}，不是 ${p.api_key_env}`:`.env 里没有 ${p.api_key_env||"密钥"}`,fix:alt?"修复":"填写密钥"};
  if(!p.ready)return {text:"还没填"+missing(p).join("、"),fix:"补全"};
  if(p.balance_mark==="empty")return {text:"已标记余额耗尽",fix:"编辑"};
  if(p.balance?.state==="unavailable"&&p.balance_mark!=="available")return {text:"余额查询显示账户不可用",fix:"编辑"};
  return null;
}
function balanceText(p){
  const b=p.balance,parts=[];
  if(b?.entries)parts.push(b.entries.map(e=>`${e.currency} ${e.amount}`).join(" / "));
  else if(b?.state==="error")parts.push("余额查询失败");
  if(marks[p.balance_mark]&&p.balance_mark!=="empty")parts.push(marks[p.balance_mark]);
  return parts.join(" · ");
}
function profile(id){ return (state?.apis||[]).find(p=>p.id===id); }
function balanceSupported(p){ return ["https://api.deepseek.com","https://api.deepseek.com/v1"].includes((p.base_url||"").replace(/\/$/,"")); }
function apiRow(){
  const row=rowSkeleton();
  row.children[2].addEventListener("click",()=>apiAction(row.children[2].dataset.action,row.dataset.key));
  row.children[3].addEventListener("click",e=>openMenu(e.currentTarget,"api",row.dataset.key));
  return row;
}
function fillApi(row,p){
  const problem=apiProblem(p),proto=p.protocol==="auto"||!p.protocol?`${protocols[p.effective_protocol]||"OpenAI 兼容"}（自动）`:protocols[p.protocol]||p.protocol;
  const todo=problem&&!p.active,sub=todo?problem.text:[p.model,proto,!problem&&balanceText(p)].filter(Boolean).join(" · ");
  fillRow(row,{name:p.name,sub,note:armedFor("switch",p.id)?"再点一次确认：会写入 .env 并重启 QQbot":p.active&&problem?problem.text:"",
    badge:running(p.id)?"处理中…":p.active?"正在使用":"",tone:running(p.id)?"plain":"current",
    action:p.active?"":problem?"fix":"switch",actionLabel:p.active?"":problem?problem.fix:"切换",armedLabel:"确认切换",moreLabel:`${p.name} 更多操作`});
}
function renderApis(){
  const profiles=state?.apis||[],names=state?.api_key_names||[],datalist=$("api-key-names"),query=$("search").value.toLowerCase();
  if([...datalist.options].map(o=>o.value).join()!==names.join())datalist.replaceChildren(...names.map(n=>Object.assign(make("option"),{value:n})));
  const match=profiles.filter(p=>!query||`${p.name} ${p.model}`.toLowerCase().includes(query));
  // The active profile stays with the usable ones even when it has a problem, so "正在使用" is never filed under 待配置.
  const usable=match.filter(p=>p.active||!apiProblem(p)),todo=match.filter(p=>!p.active&&apiProblem(p));
  const total=profiles.filter(p=>p.active||!apiProblem(p)).length,totalTodo=profiles.length-total;
  groupCount("api",query?`${usable.length} / ${total}`:String(total),query?!usable.length:profiles.length>0&&!total);
  groupCount("todo",query?`${todo.length} / ${totalTodo}`:String(totalTodo),!todo.length);
  sync($("apis"),usable,p=>p.id,apiRow,fillApi,()=>emptyState("添加一个 API 接口，机器人就能使用云端模型。","添加接口",()=>editApi()));
  sync($("apis-todo"),todo,p=>p.id,apiRow,fillApi,()=>make("div"));
  setText($("model-count"),String(profiles.length+(state?.models||[]).length||""));
}
function groupCount(name,text,hide){
  const group=document.querySelector(`.group[data-group=${name}]`);
  setText(group.querySelector(".group-head small"),text);group.hidden=!!hide;
}
let collapsed=new Set();
try{collapsed=new Set(JSON.parse(localStorage.getItem("panel-collapsed")||"[]"));}catch{}
document.querySelectorAll(".group").forEach(group=>{
  const head=group.querySelector(".group-head"),apply=()=>{const c=collapsed.has(group.dataset.group);group.classList.toggle("collapsed",c);head.setAttribute("aria-expanded",String(!c));};

});
function apiAction(kind,id){
  const p=profile(id);if(!p)return;
  if(kind==="fix")return editApi(p,!p.has_key?p.key_alternatives?.[0]:"");

// ---- row menu
function openMenu(anchor,kind,id){
  const menu=$("menu");
  if(menuFor===anchor){return closeMenu();}
  menuFor=anchor;menu.replaceChildren();
  const add=(label,fn,{danger=false,locked=false}={})=>{
    const b=make("button",danger?"danger":"",label);b.setAttribute("role","menuitem");b.disabled=busy||locked;
    b.addEventListener("click",()=>{if(fn(b)!=="keep")closeMenu();});menu.append(b);
  };
  if(kind==="local"){
    const m=(state?.models||[]).find(x=>x.name===id);if(!m)return closeMenu();
    add(m.loaded?"重新加载到内存":"加载到内存",()=>act("warm",id));
  }else{
    const p=profile(id);if(!p)return closeMenu();
    const locked=!!p.active;
    add("编辑",()=>editApi(p),{locked});
    if(balanceSupported(p))add("查询余额",()=>act("api_balance",id));
    add(armedFor("delete",id)?"确认删除":"删除",b=>{
      if(armedFor("delete",id)){armed=null;act("api_delete",id);return;}
      arm("delete",id);b.textContent="确认删除：再点一次";clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;closeMenu();renderAll();},5000);return "keep";
    },{danger:true,locked});
    if(locked)menu.append(make("div","why","正在使用的接口要先切换到其他配置，才能编辑或删除。"));
  }
  menu.hidden=false;
  const r=anchor.getBoundingClientRect(),w=menu.offsetWidth,h=menu.offsetHeight;
  menu.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+"px";
  menu.style.top=(r.bottom+4+h>innerHeight?Math.max(8,r.top-h-4):r.bottom+4)+"px";
  menu.querySelector("button:enabled")?.focus();
}
function closeMenu(){ $("menu").hidden=true;menuFor=null; }
document.addEventListener("click",e=>{ if(menuFor&&!$("menu").contains(e.target)&&!menuFor.contains(e.target))closeMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeMenu(); });
addEventListener("scroll",closeMenu,true);addEventListener("resize",closeMenu);

// ---- logs
// Appends only: lines already on screen stay put, so reading older lines is never interrupted by a refresh.
const LOG_KEEP=2000,ERR=/\b(ERROR|CRITICAL|FATAL)\b|\[ERROR\]|level=ERROR|Traceback \(most recent call last\)/,WARN=/\bWARN(ING)?\b|\[WARNING\]|level=WARN/,STAMPED=/^(\d{4}-\d\d-\d\d|time=)/;
// logFollow: the reader is at the bottom, so new lines and reflows keep the view pinned there.
// logError: why the last read failed; lines already shown stay, so the reader keeps what was read before.
const OFFLINE="连不上面板服务，检查它是否还在运行";
let logId="",logOffset=null,logLevel="",logBusy=false,logAgain=false,logCatalog=null,logFollow=true,logError="";
try{logId=localStorage.getItem("panel-log")||"";}catch{}
async function getJSON(url){
  let r,data={};
  try{r=await fetch(url,{headers:{"X-Panel-Token":token}});}catch{throw Object.assign(Error(OFFLINE),{offline:true});}
  try{data=await r.json();}catch{}
  if(r.ok)return data;
  // An older panel process serves the new page but has no log endpoint until it restarts.
  if(r.status===404&&url==="/api/logs")throw Error("面板服务需要重启，重启后才能看日志");
  throw Error(data.error||"日志读取失败");
}
// A timestamped line says its own level near the start; a line without one (traceback, wrapped JSON) belongs to the line above.
function levelOf(line){
  if(STAMPED.test(line)){const head=line.slice(0,64);return logLevel=ERR.test(head)?"error":WARN.test(head)?"warn":"";}
  if(!logLevel&&ERR.test(line))logLevel="error";
  return logLevel;
}
function renderLogPicker(){
  const pick=$("log-pick"),present=(logCatalog||[]).filter(l=>l.exists);
  pick.hidden=$("log-issues").parentElement.hidden=!present.length;
  if(!present.some(l=>l.id===logId))logId=present[0]?.id||"";
  const want=present.map(l=>l.id+l.label).join();
  if(pick.dataset.want!==want){pick.dataset.want=want;pick.replaceChildren(...present.map(l=>Object.assign(make("option","",l.label),{value:l.id})));}
  setProp(pick,"value",logId);
}
function renderLogMeta(){
  const meta=(logCatalog||[]).find(l=>l.id===logId),shown=$("log-lines").children.length;
  $("log-meta").classList.toggle("bad",!!logError&&!!shown);
  // Offline is already said by the status bar above, so the note only says what the lines are.
  setText($("log-meta"),logError?(!shown?"":logError.offline?"下面是之前读到的内容。":`${logError.message}。下面是之前读到的内容。`):meta?.file||"");
}
function renderLogEmpty(){
  const lines=$("log-lines"),issues=$("log-issues").checked,shown=issues?lines.querySelectorAll(".logline[data-level]").length:lines.children.length;
  let empty=$("log-box").querySelector(".empty");
  const text=logError&&!lines.children.length?logError.message+"。":!logCatalog?"正在读取日志…":!logCatalog.some(l=>l.exists)?"还没有日志。QQbot 和面板运行后会写在 var/logs 里。"
    :!lines.children.length?"这个日志还是空的。":issues&&!shown?"最近的日志里没有警告或错误。":"";
  empty?.classList.toggle("bad",!!logError);
  if(!text){empty?.remove();return;}
  if(!empty){empty=make("div","empty");$("log-box").append(empty);}
  setText(empty,text);
}
function atBottom(box){ return box.scrollHeight-box.scrollTop-box.clientHeight<24; }
async function refreshLog(){
  if(page!=="logs")return;
  if(logBusy){logAgain=true;return;}
  logBusy=true;
  try{
    logCatalog=(await getJSON("/api/logs")).logs;renderLogPicker();
    const id=logId;
    if(id){
      const data=await getJSON(`/api/logs/${encodeURIComponent(id)}`+(logOffset===null?"":`?after=${logOffset}`));
      if(id===logId)appendLog(data);
    }
    logError="";
  }catch(e){logError=e;}
  finally{renderLogPicker();renderLogEmpty();renderLogMeta();logBusy=false;if(logAgain){logAgain=false;refreshLog();}}
}
function appendLog(data){
  const box=$("log-box"),lines=$("log-lines"),follow=data.reset||logOffset===null||logFollow;
  if(data.reset){lines.replaceChildren();logLevel="";}
  logOffset=data.offset;
  if(!data.lines.length)return;
  const fragment=document.createDocumentFragment();
  for(const line of data.lines){const node=make("div","logline",line||" ");const level=levelOf(line);if(level)node.dataset.level=level;fragment.append(node);}
  lines.append(fragment);
  const before=box.scrollHeight;
  while(lines.children.length>LOG_KEEP)lines.firstChild.remove();
  if(follow){logFollow=true;box.scrollTop=box.scrollHeight;$("log-jump").hidden=true;}
  else{box.scrollTop-=before-box.scrollHeight;$("log-jump").hidden=false;}
}
function pickLog(id){
  logId=id;logOffset=null;logLevel="";logFollow=true;$("log-lines").replaceChildren();$("log-jump").hidden=true;
  try{localStorage.setItem("panel-log",id);}catch{}
  refreshLog();
}
$("log-pick").addEventListener("change",e=>pickLog(e.target.value));
$("log-issues").addEventListener("change",e=>{$("log-box").classList.toggle("only-issues",e.target.checked);renderLogEmpty();pinLog();});
function pinLog(){ const box=$("log-box");logFollow=true;box.scrollTop=box.scrollHeight;$("log-jump").hidden=true; }
$("log-box").addEventListener("scroll",e=>{logFollow=atBottom(e.currentTarget);if(logFollow)$("log-jump").hidden=true;});
$("log-jump").addEventListener("click",pinLog);
// Wrapping changes with the width, so a resize or the page becoming visible would otherwise leave a follower mid-log.
const logResize=new ResizeObserver(()=>{if(logFollow)$("log-box").scrollTop=$("log-box").scrollHeight;});
logResize.observe($("log-lines"));logResize.observe($("log-box"));

// ---- page chrome
function showPage(name){
  page=titles[name]?name:"models";
  document.querySelectorAll("section[data-page]").forEach(s=>s.hidden=s.dataset.page!==page);
  document.querySelectorAll("nav a").forEach(a=>a.dataset.page===page?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  document.querySelectorAll(".tools").forEach(t=>t.hidden=t.dataset.for!==page);
  setText($("title"),titles[page]);closeMenu();
  if(page==="logs")refreshLog();
}
addEventListener("hashchange",()=>showPage(location.hash.slice(1)));
function status(text,kind=""){ $("status").hidden=!text;setText($("status-text"),text);$("status").dataset.state=kind;$("status-close").hidden=kind!=="completed"&&kind!=="failed"; }
$("status-close").addEventListener("click",()=>{dismissed=lastJob;status(idleText());});
function idleText(){ return !state?"正在读取状态…":""; }
function renderChrome(){
  const api=activeApi(),gw=state.gateway?.alive?(state.gateway.status==="ready"?"QQbot 已就绪":"QQbot 连接中"):"QQbot 未运行";
  setText($("now"),`正在使用 ${state.current.model||"未配置的模型"} · ${api?api.name:isLocal(state.current.base_url)?"本地 Ollama":"自定义接口"} · ${gw}`);
  setText($("ollama-state"),state.ollama.online?"运行中":"未启动");$("start").hidden=!!state.ollama.online;setProp($("start"),"disabled",busy);
  setText($("gateway-state"),gw.replace("QQbot ",""));setText($("ollama-url"),state.ollama.url||"—");setText($("last-answer"),answerText(lastAnswer));
  // An older panel process does not send last_answer: hide the row rather than claim there is no record.
  $("last-answer").hidden=$("last-answer-label").hidden=lastAnswer===undefined;setText($("config"),state.config_path||"var/models.json");
  setProp($("api-add"),"disabled",busy);setProp($("refresh"),"disabled",refreshing);setProp($("api-submit"),"disabled",busy);
}
// usage.log times a whole answer: every model call and tool step, not one request.
function answerText(a){
  if(!a)return "还没有记录";
  const s=a.seconds,took=s<60?`${s} 秒`:`${Math.floor(s/60)} 分 ${s%60} 秒`;
  const [date,time]=a.at.split(" "),day=d=>new Date(Date.now()-d*864e5).toLocaleDateString("sv");
  const when=date===day(0)?"今天":date===day(1)?"昨天":`${+date.slice(5,7)}月${+date.slice(8)}日`;
  return `用时 ${took} · 调用模型 ${a.calls} 次 · ${when} ${time.slice(0,5)}`;
}
function renderAll(){ if(!state)return;renderChrome();renderLocal();renderApis(); }
function jobText(j){
  if(j.state!=="running")return j.message;
  return {start:"正在启动 Ollama…",warm:`正在加载 ${j.model}…`,switch:`正在切换到 ${j.model}，QQbot 会重启…`,api_switch:"正在切换接口，QQbot 会重启…",
    api_save:"正在保存接口…",api_delete:"正在删除接口…",api_balance:"正在查询余额…"}[j.action]||"正在处理…";
}
async function refresh(){
  if(refreshing)return;refreshing=true;
  try{
    const r=await fetch("/api/status").catch(()=>{throw Error(OFFLINE);}),data=await r.json();if(!r.ok)throw Error(data.error||"读取状态失败");
    const firstLoad=!state;
    state=data.status;job=data.job;lastAnswer=data.last_answer;busy=job?.state==="running";
    // A job that finished before this page opened is history, not news.
    if(firstLoad&&job&&!busy)dismissed=lastJob=JSON.stringify(job);
    if(!page)showPage(location.hash.slice(1));
    const signature=JSON.stringify(job);
    if(job&&signature!==lastJob){
      lastJob=signature;
      // Only the save this page submitted may close the dialog; a failed save keeps every field, including the key.
      if(pendingSave&&job.action==="api_save"&&!busy){
        pendingSave=false;
        if(job.state==="completed")closeDialog();else setText($("dialog-error"),job.message);
      }
    }
    if(job&&lastJob!==dismissed)status(jobText(job),job.state);else status(idleText());
    renderAll();
  }catch(e){status(e.message===OFFLINE?OFFLINE+"。":e.message+"。检查面板服务后刷新页面。","failed");}
  finally{refreshing=false;if(state)renderChrome();}
}
async function act(action,model){
  if(busy)return;busy=true;renderAll();status("正在提交…","running");
  try{
    const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Panel-Token":token},body:JSON.stringify({action,model})});
    const data=await r.json();if(!r.ok)throw Error(data.error||"提交失败");
    lastJob="";dismissed="";await refresh();
  }catch(e){
    busy=false;renderAll();
    if(pendingSave){pendingSave=false;setText($("dialog-error"),e.message);}
    status(e.message,"failed");
  }
}
$("search").addEventListener("input",()=>{$("groups").classList.toggle("searching",!!$("search").value);renderLocal();renderApis();});$("refresh").addEventListener("click",refresh);
$("api-add").addEventListener("click",()=>editApi());$("start").addEventListener("click",()=>act("start"));
refresh();setInterval(()=>{refresh();refreshLog();},3000);
</script>
