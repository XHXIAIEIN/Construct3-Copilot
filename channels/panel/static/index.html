<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQbot 模型</title>
<style>
:root{
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Microsoft YaHei UI","Microsoft YaHei",monospace;
  /* --muted stays at 4.5:1 on the page and the surface: times and counts are read, not decoration */
  --page:#f5f4ef;--surface:#ffffff;--side:#efeee8;--hover:rgba(31,30,29,.045);--selected:rgba(31,30,29,.08);--sunk:#f8f7f3;
  --text:#1f1e1d;--text2:#5f5d57;--muted:#6f6d66;--faint:#c4c2ba;--border:rgba(31,30,29,.1);--border2:rgba(31,30,29,.2);
  --primary:#1f1e1d;--on-primary:#faf9f5;--accent:#2c6fd6;
  --ok:#2f6b3f;--ok-bg:#e5efe2;--warn:#8a5a00;--warn-bg:#f6ecd4;--danger:#b5402f;--danger-bg:#f8e6e2;--info:#2a5aa8;--info-bg:#e4ecf8;--private:#2a78d6;--group:#eb6834;
  --shadow:0 8px 24px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.08);
  color-scheme:light;font:14px/1.5 var(--sans);color:var(--text);
}
@media (prefers-color-scheme:dark){:root{
  --page:#151515;--surface:#1f1e1d;--side:#1a1a19;--hover:rgba(255,255,255,.05);--selected:rgba(255,255,255,.1);--sunk:#252423;
  --text:#f0efec;--text2:#adaba3;--muted:#8f8d85;--faint:#4a4945;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.2);
  --primary:#f0efec;--on-primary:#151515;--accent:#6c9fec;
  --ok:#8fc49a;--ok-bg:#1f3324;--warn:#e0b45c;--warn-bg:#3a2e14;--danger:#ec8f80;--danger-bg:#3d201b;--info:#9dbcf0;--info-bg:#1d2a40;--private:#3987e5;--group:#d95926;
  --shadow:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);color-scheme:dark;
}}
*{box-sizing:border-box}body{margin:0;background:var(--page)}[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--border2);background:transparent;border-radius:8px;padding:5px 12px;min-height:32px;cursor:pointer;white-space:nowrap}
button:hover:enabled{background:var(--hover)}button:disabled{color:var(--muted);cursor:default}
button.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}button.primary:hover:enabled{opacity:.88;background:var(--primary)}
button.ghost{border-color:transparent}button.confirm{border-color:var(--danger);color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;min-height:34px;min-width:0}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav{background:var(--side);border:1px solid var(--border);border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
/* a floating card that stays the window's height while the page scrolls */
nav{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;align-self:start}
.brand{font-weight:600;padding:0 4px 10px 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.side-toggle{border-color:transparent;min-height:28px;padding:5px 6px;color:var(--text2);display:inline-flex;align-items:center}
.app.side-collapsed{grid-template-columns:minmax(0,1fr)}.app.side-collapsed nav{display:none}.app:not(.side-collapsed) #side-show{display:none}
.title-row{display:flex;gap:8px;align-items:flex-start}.title-row #side-show{margin:-1px 0 0 -8px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text2);text-decoration:none}
nav a:hover{background:var(--hover)}nav a[aria-current=page]{background:var(--selected);color:var(--text)}nav a small{color:var(--muted)}
main{padding:28px 32px;max-width:960px;width:100%}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 16px;margin-bottom:16px}header>div:first-child{flex:1 1 300px;min-width:0}.tools{flex-shrink:0}
h1{font-size:22px;font-weight:500;margin:0 0 2px}.sub{color:var(--text2);font-size:13px}.sub.warn{color:var(--warn)}.muted{color:var(--muted);font-size:12px}
.status{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;margin-bottom:16px;background:var(--hover);color:var(--text2);font-size:13px}
.status[data-state=running]{background:var(--info-bg);color:var(--info)}.status[data-state=failed]{background:var(--danger-bg);color:var(--danger)}.status[data-state=completed]{background:var(--ok-bg);color:var(--ok)}
.status span{flex:1}.status button{min-height:26px;padding:2px 10px;font-size:12px}
.list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--border)}.row:first-child{border-top:0}
.row .what{flex:1;min-width:0}.row .name{font-weight:500;overflow-wrap:anywhere}.row .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .note{font-size:12px;color:var(--warn);margin-top:2px}.row .note:empty{display:none}
.badge{font-size:12px;padding:1px 8px;border-radius:6px;white-space:nowrap}.badge:empty{display:none}
.badge[data-tone=current]{background:var(--info-bg);color:var(--info)}.badge[data-tone=ok]{background:var(--ok-bg);color:var(--ok)}
.badge[data-tone=warn]{background:var(--warn-bg);color:var(--warn)}.badge[data-tone=danger]{background:var(--danger-bg);color:var(--danger)}.badge[data-tone=plain]{background:var(--hover);color:var(--text2)}
.more{border-color:transparent;padding:4px 8px;color:var(--text2);font-size:16px;line-height:1}
.empty{padding:28px 16px;text-align:center;color:var(--text2)}.empty button{margin-top:10px}
.tools{display:flex;gap:8px}.tools input{width:200px}
.menu{position:fixed;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 10px;min-height:30px}
.menu button.danger{color:var(--danger)}.menu .why{padding:2px 10px 6px;font-size:12px;color:var(--muted);max-width:240px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:20px 22px;display:flex;flex-direction:column;gap:14px}dialog h2{font-size:17px;font-weight:500;margin:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}.field>span{color:var(--text2)}.field small{color:var(--muted);font-size:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1px solid var(--border);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px}legend{padding:0 4px;color:var(--text2);font-size:13px}
.hint{font-size:12px;color:var(--warn)}#gateway-state.warn{color:var(--warn)}.hint:empty{display:none}
.error{font-size:13px;color:var(--danger);background:var(--danger-bg);padding:8px 10px;border-radius:8px}.error:empty{display:none}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
details summary{cursor:pointer;color:var(--text2);font-size:13px}details[open] summary{margin-bottom:8px}
.facts{display:grid;grid-template-columns:140px minmax(0,1fr);gap:0}.facts>*{padding:11px 14px;border-top:1px solid var(--border)}
.facts>:nth-child(-n+2){border-top:0}.facts dt{color:var(--text2)}.facts dd{margin:0;overflow-wrap:anywhere;display:flex;justify-content:space-between;gap:8px;align-items:center}.facts dd button{min-height:26px;padding:2px 10px;font-size:12px;margin:-4px 0}

.group{margin-bottom:20px}.group-head{display:flex;width:100%;align-items:center;gap:8px;border:0;border-radius:6px;padding:4px 4px 8px;min-height:0;font-weight:500;text-align:left}
.group-head:hover:enabled{background:transparent}.group-head small{color:var(--muted);font-weight:400}
.chev{margin-left:auto;margin-right:6px;width:7px;height:7px;border-right:1.5px solid var(--text2);border-bottom:1.5px solid var(--text2);transform:rotate(45deg);transition:transform .15s}
.group.collapsed .chev{transform:rotate(-45deg)}.group.collapsed .list{display:none}.searching .group.collapsed .list{display:block}
.check{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;white-space:nowrap}.check input,.tools .check input{width:auto;min-height:0;margin:0;padding:0;accent-color:var(--primary)}
/* ---- logs. Every row shares one grid: the time, a marker column, then the text, so the eye runs down one edge.
   What people said is set in the sans face; what the program wrote stays monospace and a step quieter. */
.logwrap{position:relative}
.logbox{height:calc(100vh - 140px);min-height:320px;overflow:auto;padding:0 2px 16px;font:13px/20px var(--sans)}
.logbox{--lt:52px;--gut:12px;--mk:20px;contain:inline-size}  /* a long unbroken line scrolls inside, never widens the page */
.app:has(#status:not([hidden])) .logbox{height:calc(100vh - 200px)}  /* the box ends at the window's bottom, below the status bar when one shows */
.logbox::-webkit-scrollbar{width:12px}.logbox::-webkit-scrollbar-button{display:none}
.logbox::-webkit-scrollbar-thumb{background:var(--border2);background-clip:padding-box;border:3px solid transparent;border-radius:6px}.logbox::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
.lt{flex:none;width:var(--lt);margin-right:var(--mk);color:var(--muted);font:12px/20px var(--sans);font-variant-numeric:tabular-nums}
.logline,.logboot{position:relative;display:flex;align-items:baseline;padding:1px var(--gut);border-radius:8px}
.logline .lm{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text2);font:12px/20px var(--mono)}
.long:not(.open){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.long.open{cursor:pointer}
.logline .lk{flex:none;margin-right:8px;padding:0 6px;border-radius:4px;font:11px/18px var(--sans)}.logline .lk:empty{display:none}
.sid{white-space:nowrap;color:var(--muted)}
.logline[data-level] .lm{color:var(--text)}
.logline[data-level=warn] .lt{color:var(--warn)}.logline[data-level=warn] .lk{background:var(--warn-bg);color:var(--warn)}
.logline[data-level=error]{background:var(--danger-bg)}.logline[data-level=error] .lt{color:var(--danger)}.logline[data-level=error] .lk{background:var(--danger);color:var(--surface)}
/* a traceback's lines make one tinted block */
.logline[data-level=error]:has(+ .logline[data-level=error]){border-bottom-left-radius:0;border-bottom-right-radius:0}
.logline[data-level=error]+.logline[data-level=error]{border-top-left-radius:0;border-top-right-radius:0}
/* the day stays at the top while its rows scroll under it */
.logday{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;margin:0 -2px;padding:16px calc(2px + var(--gut)) 8px;background:linear-gradient(var(--page) calc(100% - 8px),transparent);color:var(--text2);font:12px/18px var(--sans);letter-spacing:.02em}
.logday::after{content:"";flex:1;height:1px;background:var(--border)}
/* a turn is a card: the question and the start of the answer, opened in place to the whole reply, the counts and the
   tool trace. Starts and the program's lines stay on the page between the cards. */
.turn{position:relative;margin:8px 0;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(31,30,29,.04);font:14px/22px var(--sans);transition:border-color .12s,box-shadow .12s}
.turn:not(.open):hover{border-color:var(--border2)}.turn.open{box-shadow:0 2px 10px rgba(31,30,29,.06)}
.turnhead{display:flex;align-items:baseline;width:100%;min-height:0;padding:11px var(--gut) 12px calc(var(--gut) - 1px);border:0;border-radius:11px;text-align:left;white-space:normal;font:inherit}
.turnhead:hover:enabled{background:none}
/* the marker is blue for a private chat and orange for a group, as on the stats page; it pulses while the answer is coming */
.turnhead::before{content:"";position:absolute;left:calc(var(--gut) + var(--lt) + 4px);top:18px;width:7px;height:7px;border-radius:50%;background:var(--private)}
.turn[data-chat=group] .turnhead::before{background:var(--group)}
.turn.pending .turnhead::before{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.turnhead .sum{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.turnhead b,.turnhead .snip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.turnhead b{font-weight:400}
.turnhead .snip{font-size:13px;line-height:20px;color:var(--text2)}.turnhead .snip:empty{display:none}
.turnhead .meta{flex:none;display:flex;align-items:center;margin-left:16px;font-size:12px;color:var(--muted);white-space:nowrap}
.turnhead .meta::after,.tracebtn::after{content:"";width:5px;height:5px;margin:0 2px 0 4px;border-right:1.5px solid;border-bottom:1.5px solid;transform:translateY(-1px) rotate(-45deg);transition:transform .15s}
.turn.open .meta::after,.tracebtn[aria-expanded=true]::after{transform:translateY(-2px) rotate(45deg)}
.turnhead .model:not(:empty)::before{content:"·";margin:0 5px}.turnhead .meta::after{margin-left:12px}
.turn.open b{white-space:normal}.turn.open .snip{display:none}
.turnbody{padding:0 var(--gut) 16px calc(var(--gut) + var(--lt) + var(--mk) - 1px)}
.turnbody .info{margin:-4px 0 10px;font-size:12px;line-height:18px;color:var(--muted)}
.turnbody .reply{max-width:46em;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.85}
.turntools{display:flex;gap:10px;align-items:baseline;margin-top:14px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;line-height:20px;color:var(--muted)}.turntools:empty{display:none}
/* the tool names stay one line and scroll sideways, however many there are; the right edge fades into what is hidden */
.turntools .names{flex:1 1 0;width:0;overflow-x:auto;white-space:nowrap;color:var(--text2);font:12px/20px var(--mono);-webkit-mask-image:linear-gradient(to left,transparent,#000 28px);mask-image:linear-gradient(to left,transparent,#000 28px)}
.turntools .names::-webkit-scrollbar{height:4px}.turntools .names::-webkit-scrollbar-button{display:none}
.turntools .names::-webkit-scrollbar-thumb{background:transparent;border-radius:2px}.turntools .names:hover::-webkit-scrollbar-thumb{background:var(--border2)}
.turnbody .extra{margin-top:8px;font:12px/20px var(--mono);color:var(--muted)}.turnbody .extra:empty{display:none}
.tracebtn{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:0;margin-right:-6px;padding:0 6px;border:0;border-radius:4px;font:12px/20px var(--sans);color:var(--text2)}
.tracebtn:hover:enabled{color:var(--text)}
.trace{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--sunk);font:12px/20px var(--mono)}.trace.bad{color:var(--danger)}
.trace .step{display:flex;gap:10px;padding:2px 0}.trace .n{flex:none;min-width:3ch;text-align:right;color:var(--muted)}.trace .st{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}.trace b{font-weight:600}
/* one row per start of the QQ process: when it started and how long it took to connect */
.logboot{padding:3px var(--gut);color:var(--muted);font:12px/20px var(--sans)}
.logboot::before{content:"";position:absolute;left:calc(var(--gut) + var(--lt) + 5px);top:10px;width:7px;height:7px;box-sizing:border-box;border:1.5px solid var(--faint);border-radius:50%}
.logboot.bad{color:var(--warn)}.logboot.bad::before{border-color:currentColor}
.only-issues .logline:not([data-level]),.only-issues .logday,.only-issues .turn,.only-issues .logboot:not(.bad){display:none}
.logbox .empty{padding:64px 16px;font:14px/1.6 var(--sans)}.logbox .empty.bad{color:var(--danger)}
.jump{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:6px 16px;border-color:transparent;border-radius:999px;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow);font-size:13px}
.jump:hover:enabled{background:var(--primary);opacity:.9}
.logmeta{margin-top:10px;padding:0 4px}.logmeta.bad{color:var(--danger)}
@media (prefers-reduced-motion:reduce){.turn.pending .turnhead::before{animation:none}.turn,.turnhead .meta::after,.tracebtn::after{transition:none}}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border2);border-radius:8px}
.seg button{border:0;min-height:28px;padding:3px 14px;border-radius:6px;color:var(--text2)}.seg button[aria-pressed=true]{background:var(--selected);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.kpi{position:relative;display:block;text-align:left;white-space:normal;border:0;border-left:1px solid var(--border);border-radius:0;padding:14px 16px 16px;min-height:0}.kpi:nth-child(4n+1){border-left:0}.kpi:nth-child(n+5){border-top:1px solid var(--border)}
.app-note{margin:-4px 0 12px}
.kpi[aria-pressed=true]{background:var(--hover)}.kpi[aria-pressed=true]::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:var(--info)}
.kpi .k{font-size:12px;color:var(--text2)}.kpi .v{font-size:24px;font-weight:500;line-height:1.35}.kpi .v small{font-size:13px;font-weight:400;color:var(--text2);margin:0 4px 0 2px}
.kpi .n{font-size:12px;color:var(--muted);word-break:keep-all}
.chart{padding:14px 16px 10px;margin-bottom:12px}.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500;margin-bottom:12px}.chart-head small{color:var(--muted);font-weight:400;font-size:12px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;height:120px;border-bottom:1px solid var(--border)}.bars.hours{height:72px;gap:2px}
.cell{display:flex;align-items:flex-end;height:100%}.bar{width:100%;min-height:2px;background:var(--info);border-radius:4px 4px 0 0}.bar.zero{background:var(--border);border-radius:0}.cell:hover .bar{opacity:.7}
.bar.split{display:flex;flex-direction:column-reverse;gap:2px;background:none;overflow:hidden}.bar.split i{min-height:2px}.bar.split .u,.legend .u{background:var(--border2)}.bar.split .p,.legend .p{background:var(--private)}.bar.split .g,.legend .g{background:var(--group)}
.chart-head .side{display:flex;gap:12px;align-items:baseline}.legend{display:flex;gap:10px;font-size:12px;color:var(--text2);font-weight:400}.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:8px;height:8px;border-radius:2px}
.ticks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-top:4px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}.hours+.ticks{gap:2px}
.toolrow{display:grid;grid-template-columns:minmax(0,1fr) 56px 88px minmax(72px,160px);gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
.toolrow:first-child{border-top:0;padding-top:0;font-size:12px;color:var(--muted)}.toolrow .num{text-align:right;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.toolrow .num small{margin-right:6px;font-size:11px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px}.meter .track{flex:1;height:6px;border-radius:3px;background:var(--hover)}.meter .fill{height:100%;border-radius:3px;background:var(--danger)}
.meter span{width:34px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}.toolrow:first-child .meter span{width:auto}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px 10px;font-size:12px;color:var(--text2);white-space:nowrap}.tip b{display:block;color:var(--text);font-weight:500}
@media(max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{position:static;height:auto;margin:0;border-radius:0;border-width:0 0 1px;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border);padding:8px 12px;overflow-x:auto}
  .brand{padding:0 8px 0 0}.side-toggle{display:none!important}.app.side-collapsed nav{display:flex}main{padding:16px}header{flex-direction:column}header>div:first-child{flex-basis:auto}.tools,.tools input{width:100%}.pair{grid-template-columns:1fr}
  .toolrow{grid-template-columns:56px 104px minmax(80px,1fr);row-gap:2px}.toolrow>:first-child{grid-column:1/-1}.toolrow:first-child{display:none}.toolrow .num{text-align:left}.toolrow .calls::before{content:"调用 "}.toolrow .fail::before{content:"失败 "}.toolrow .fail{display:flex;align-items:baseline;white-space:pre}.toolrow .fail small{order:2;margin:0 0 0 6px}
  .kpis{grid-template-columns:1fr 1fr}.kpis .kpi{border-left:1px solid var(--border)}.kpis .kpi:nth-child(2n+1){border-left:0}.kpis .kpi:nth-child(n+3){border-top:1px solid var(--border)}.kpi .v{font-size:20px}

}

<script>
const token="__PANEL_TOKEN__";
const $=id=>document.getElementById(id);
const protocols={openai:"OpenAI 兼容",anthropic:"Anthropic"},marks={available:"余额充足",low:"余额偏低",empty:"余额耗尽"};
const titles={models:"模型",logs:"日志",stats:"统计",settings:"设置"};
// editingApi: null while the dialog is closed, "" for a new profile, else the profile id.
let state=null,job=null,page="",busy=false,refreshing=false,lastJob="",pendingSave=false,editingApi=null,armed=null,armTimer=0,menuFor=null,dismissed="";

// Polls write only what changed, so rows, buttons and the dialog keep their identity between refreshes.
function setText(node,text){ if(node.textContent!==text)node.textContent=text; }
function setProp(node,key,value){ if(node[key]!==value)node[key]=value; }
function make(tag,className="",text=""){ const node=document.createElement(tag);if(className)node.className=className;if(text)node.textContent=text;return node; }
function sync(list,items,keyOf,create,update,empty){
  const rows=new Map();
  for(const row of [...list.children]){ if(row.dataset.key===undefined)row.remove();else rows.set(row.dataset.key,row); }
  let previous=null;
  for(const item of items){
    const key=keyOf(item);let row=rows.get(key);
    if(row)rows.delete(key);else{row=create();row.dataset.key=key;}
    update(row,item);
    const expected=previous?previous.nextSibling:list.firstChild;
    if(row!==expected)list.insertBefore(row,expected);
    previous=row;
  }
  for(const row of rows.values())row.remove();
  if(!items.length)list.append(empty());
}
function emptyState(text,buttonLabel,onClick){
  const box=make("div","empty",text);
  if(buttonLabel){const b=make("button","",buttonLabel);b.addEventListener("click",onClick);box.append(make("br"),b);}
  return box;
}
function rowSkeleton(){
  const row=make("div","row"),what=make("div","what");
  what.append(make("div","name"),make("div","sub"),make("div","note"));
  const badge=make("span","badge"),action=make("button"),more=make("button","more","⋯");
  action.type=more.type="button";more.setAttribute("aria-haspopup","menu");
  row.append(what,badge,action,more);return row;
}
function fillRow(row,{name,sub,note,badge,tone,action,actionLabel,armedLabel,moreLabel}){
  const [what,badgeNode,button,more]=row.children,[nameNode,subNode,noteNode]=what.children;
  setText(nameNode,name);setText(subNode,sub);subNode.title=sub;setText(noteNode,note||"");
  setText(badgeNode,badge||"");badgeNode.dataset.tone=tone||"plain";
  const isArmed=armed&&armed.kind===action&&armed.id===row.dataset.key;
  button.hidden=!actionLabel;setText(button,isArmed?armedLabel:actionLabel||"");setProp(button,"className",isArmed?"confirm":"");
  setProp(button,"disabled",busy);button.dataset.action=action||"";
  more.setAttribute("aria-label",moreLabel);
}

function arm(kind,id){ armed={kind,id};clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;renderAll();},5000);renderAll(); }
function armedFor(kind,id){ return armed&&armed.kind===kind&&armed.id===id; }

function isLocal(url){ try{return ["localhost","127.0.0.1","[::1]"].includes(new URL(url).hostname);}catch{return false;} }
function running(id){ return busy&&job&&job.model===id; }

// ---- local models
function renderLocal(){
  const online=!!state?.ollama?.online,list=state?.models||[],query=$("search").value.toLowerCase();
  const items=list.filter(m=>m.name.toLowerCase().includes(query));
  groupCount("local",query?`${items.length} / ${list.length}`:String(list.length),query&&!items.length);
  sync($("models"),items,m=>m.name,()=>{
    const row=rowSkeleton();
    row.children[2].addEventListener("click",()=>{const name=row.dataset.key;armedFor("switch",name)?(armed=null,act("switch",name)):arm("switch",name);});
    row.children[3].addEventListener("click",e=>openMenu(e.currentTarget,"local",row.dataset.key));
    return row;
  },(row,m)=>{
    const current=state.current?.model===m.name&&isLocal(state.current.base_url);
    fillRow(row,{name:m.name,sub:[m.parameter_size,m.quantization,m.size?(m.size/1e9).toFixed(1)+" GB":""].filter(Boolean).join(" · ")||"—",
      note:armedFor("switch",m.name)?"再点一次确认：会写入 .env 并重启 QQbot":"",
      badge:running(m.name)?"处理中…":current?"正在使用":m.loaded?"已加载":"",tone:running(m.name)?"plain":current?"current":"ok",
      action:"switch",actionLabel:current||!online?"":"切换",armedLabel:"确认切换",moreLabel:`${m.name} 更多操作`});
  },()=>!online?emptyState("模型服务未启动。","启动 Ollama",()=>act("start")):emptyState("本机还没有已安装的模型。检查设置里的模型配置文件。"));
}

// ---- API profiles
function missing(p){ return [!p.has_key&&"密钥",!p.model&&"模型",!p.base_url&&"服务地址"].filter(Boolean); }
// One plain sentence per problem; the 待配置 group header already says these profiles cannot be used yet.
function apiProblem(p){
  const alt=p.key_alternatives?.[0];
  if(!p.has_key)return {text:alt?`密钥在 ${alt}，不是 ${p.api_key_env}`:`.env 里没有 ${p.api_key_env||"密钥"}`,fix:alt?"修复":"填写密钥"};
  if(!p.ready)return {text:"还没填"+missing(p).join("、"),fix:"补全"};
  if(p.balance_mark==="empty")return {text:"已标记余额耗尽",fix:"编辑"};
  if(p.balance?.state==="unavailable"&&p.balance_mark!=="available")return {text:"余额查询显示账户不可用",fix:"编辑"};
  return null;
}
function balanceText(p){
  const b=p.balance,parts=[];
  if(b?.entries)parts.push(b.entries.map(e=>`${e.currency} ${e.amount}`).join(" / "));
  else if(b?.state==="error")parts.push("余额查询失败");
  if(marks[p.balance_mark]&&p.balance_mark!=="empty")parts.push(marks[p.balance_mark]);
  return parts.join(" · ");
}
function profile(id){ return (state?.apis||[]).find(p=>p.id===id); }
function balanceSupported(p){ return ["https://api.deepseek.com","https://api.deepseek.com/v1"].includes((p.base_url||"").replace(/\/$/,"")); }
function apiRow(){
  const row=rowSkeleton();
  row.children[2].addEventListener("click",()=>apiAction(row.children[2].dataset.action,row.dataset.key));
  row.children[3].addEventListener("click",e=>openMenu(e.currentTarget,"api",row.dataset.key));
  return row;
}
function fillApi(row,p){
  const problem=apiProblem(p),proto=p.protocol==="auto"||!p.protocol?`${protocols[p.effective_protocol]||"OpenAI 兼容"}（自动）`:protocols[p.protocol]||p.protocol;
  const todo=problem&&!p.active,sub=todo?problem.text:[p.model,proto,!problem&&balanceText(p)].filter(Boolean).join(" · ");
  fillRow(row,{name:p.name,sub,note:armedFor("switch",p.id)?"再点一次确认：会写入 .env 并重启 QQbot":p.active&&problem?problem.text:"",
    badge:running(p.id)?"处理中…":p.active?"正在使用":"",tone:running(p.id)?"plain":"current",
    action:p.active?"":problem?"fix":"switch",actionLabel:p.active?"":problem?problem.fix:"切换",armedLabel:"确认切换",moreLabel:`${p.name} 更多操作`});
}
function renderApis(){
  const profiles=state?.apis||[],names=state?.api_key_names||[],datalist=$("api-key-names"),query=$("search").value.toLowerCase();
  if([...datalist.options].map(o=>o.value).join()!==names.join())datalist.replaceChildren(...names.map(n=>Object.assign(make("option"),{value:n})));
  const match=profiles.filter(p=>!query||`${p.name} ${p.model}`.toLowerCase().includes(query));
  // The active profile stays with the usable ones even when it has a problem, so "正在使用" is never filed under 待配置.
  const usable=match.filter(p=>p.active||!apiProblem(p)),todo=match.filter(p=>!p.active&&apiProblem(p));
  const total=profiles.filter(p=>p.active||!apiProblem(p)).length,totalTodo=profiles.length-total;
  groupCount("api",query?`${usable.length} / ${total}`:String(total),query?!usable.length:profiles.length>0&&!total);
  groupCount("todo",query?`${todo.length} / ${totalTodo}`:String(totalTodo),!todo.length);
  sync($("apis"),usable,p=>p.id,apiRow,fillApi,()=>emptyState("添加一个 API 接口，机器人就能使用云端模型。","添加接口",()=>editApi()));
  sync($("apis-todo"),todo,p=>p.id,apiRow,fillApi,()=>make("div"));
  setText($("model-count"),String(profiles.length+(state?.models||[]).length||""));
}
function groupCount(name,text,hide){
  const group=document.querySelector(`.group[data-group=${name}]`);
  setText(group.querySelector(".group-head small"),text);group.hidden=!!hide;
}
let collapsed=new Set();
try{collapsed=new Set(JSON.parse(localStorage.getItem("panel-collapsed")||"[]"));}catch{}
document.querySelectorAll(".group").forEach(group=>{
  const head=group.querySelector(".group-head"),apply=()=>{const c=collapsed.has(group.dataset.group);group.classList.toggle("collapsed",c);head.setAttribute("aria-expanded",String(!c));};
  head.addEventListener("click",()=>{
    const name=group.dataset.group;collapsed.has(name)?collapsed.delete(name):collapsed.add(name);apply();
    try{localStorage.setItem("panel-collapsed",JSON.stringify([...collapsed]));}catch{}
  });apply();
});
function apiAction(kind,id){
  const p=profile(id);if(!p)return;
  if(kind==="fix")return editApi(p,!p.has_key?p.key_alternatives?.[0]:"");
  if(kind==="switch"){ if(armedFor("switch",id)){armed=null;act("api_switch",id);}else arm("switch",id); }
}

// ---- row menu
function openMenu(anchor,kind,id){
  const menu=$("menu");
  if(menuFor===anchor){return closeMenu();}
  menuFor=anchor;menu.replaceChildren();
  const add=(label,fn,{danger=false,locked=false}={})=>{
    const b=make("button",danger?"danger":"",label);b.setAttribute("role","menuitem");b.disabled=busy||locked;
    b.addEventListener("click",()=>{if(fn(b)!=="keep")closeMenu();});menu.append(b);
  };
  if(kind==="local"){
    const m=(state?.models||[]).find(x=>x.name===id);if(!m)return closeMenu();
    add(m.loaded?"重新加载到内存":"加载到内存",()=>act("warm",id));
  }else{
    const p=profile(id);if(!p)return closeMenu();
    const locked=!!p.active;
    add("编辑",()=>editApi(p),{locked});
    if(balanceSupported(p))add("查询余额",()=>act("api_balance",id));
    add(armedFor("delete",id)?"确认删除":"删除",b=>{
      if(armedFor("delete",id)){armed=null;act("api_delete",id);return;}
      arm("delete",id);b.textContent="确认删除：再点一次";clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;closeMenu();renderAll();},5000);return "keep";
    },{danger:true,locked});
    if(locked)menu.append(make("div","why","正在使用的接口要先切换到其他配置，才能编辑或删除。"));
  }
  menu.hidden=false;
  const r=anchor.getBoundingClientRect(),w=menu.offsetWidth,h=menu.offsetHeight;
  menu.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+"px";
  menu.style.top=(r.bottom+4+h>innerHeight?Math.max(8,r.top-h-4):r.bottom+4)+"px";
  menu.querySelector("button:enabled")?.focus();
}
function closeMenu(){ $("menu").hidden=true;menuFor=null; }
document.addEventListener("click",e=>{ if(menuFor&&!$("menu").contains(e.target)&&!menuFor.contains(e.target))closeMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeMenu(); });
addEventListener("scroll",closeMenu,true);addEventListener("resize",closeMenu);

// ---- dialog
function editApi(p=null,keyEnv=""){
  editingApi=p?.id||"";
  setText($("dialog-title"),p?`编辑 ${p.name}`:"添加接口");
  $("api-name").value=p?.name||"";$("api-model").value=p?.model||"";$("api-base").value=p?.base_url||"";
  $("api-protocol").value=p?.protocol||"auto";$("api-mark").value=p?.balance_mark||"unknown";
  $("api-key").value="";$("api-key-env").value=keyEnv||p?.api_key_env||"";
  setText($("key-hint"),keyEnv?`已改为读取 ${keyEnv}，保存后生效。`:p&&!p.has_key?`.env 中没有 ${p.api_key_env}。从列表选一个已有变量，或填写新密钥。`:"");
  setText($("dialog-error"),"");
  $("api-form").querySelector("details").open=p?.balance_mark==="empty";
  $("api-dialog").showModal();(p?$("api-model"):$("api-name")).focus();
}
function closeDialog(){ editingApi=null;pendingSave=false;$("api-key").value="";$("api-dialog").close(); }
$("api-cancel").addEventListener("click",closeDialog);
$("api-dialog").addEventListener("cancel",e=>{e.preventDefault();closeDialog();});
$("api-form").addEventListener("submit",async e=>{
  e.preventDefault();setText($("dialog-error"),"");pendingSave=true;
  await act("api_save",{id:editingApi,name:$("api-name").value,model:$("api-model").value,base_url:$("api-base").value,api_key:$("api-key").value,
    api_key_env:$("api-key-env").value,balance_mark:$("api-mark").value,protocol:$("api-protocol").value});
});

// ---- logs
// Appends only: lines already on screen stay put, so reading older lines is never interrupted by a refresh.
const LOG_KEEP=2000,ERR=/\b(ERROR|CRITICAL|FATAL)\b|\[ERROR\]|level=ERROR|Traceback \(most recent call last\)/,WARN=/\bWARN(ING)?\b|\[WARNING\]|level=WARN/,STAMPED=/^(\d{4}-\d\d-\d\d|time=)/;
// logFollow: the reader is at the bottom, so new lines and reflows keep the view pinned there.
// logError: why the last read failed; lines already shown stay, so the reader keeps what was read before.
const OFFLINE="连不上面板服务，检查它是否还在运行";
let logId="",logOffset=null,logLevel="",logBusy=false,logAgain=false,logCatalog=null,logFollow=true,logError="";
try{logId=localStorage.getItem("panel-log")||"";}catch{}
async function getJSON(url){
  let r,data={};
  try{r=await fetch(url,{headers:{"X-Panel-Token":token}});}catch{throw Object.assign(Error(OFFLINE),{offline:true});}
  try{data=await r.json();}catch{}
  if(r.ok)return data;
  // An older panel process serves the new page but has no log endpoint until it restarts.
  if(r.status===404&&(url==="/api/logs"||url.startsWith("/api/stats")||url.startsWith("/api/turns/")&&data.error==="页面不存在"))
    throw Error("面板服务需要重启，重启后才能看日志、轨迹和统计");
  throw Error(data.error||"日志读取失败");
}
// A timestamped line says its own level near the start; a line without one (traceback, wrapped JSON) belongs to the line above.
function levelOf(line){
  if(STAMPED.test(line)){const head=line.slice(0,64);return logLevel=ERR.test(head)?"error":WARN.test(head)?"warn":"";}
  if(!logLevel&&ERR.test(line))logLevel="error";
  return logLevel;
}

// A question opens its chat's turn; the lines that follow from the same chat fill it, until the chat asks again.

// The tooltip sits above the hovered column; the whole column is the target, not only the bar.
function showTip(e){
  const cell=e.target.closest?.(".cell"),tip=$("tip");
  if(!cell){tip.hidden=true;return;}
  tip.replaceChildren(make("b","",cell.dataset.name),cell.dataset.text);tip.hidden=false;
  const r=cell.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8))+"px";
  tip.style.top=Math.max(8,r.top-tip.offsetHeight-6)+"px";
}
["trend","hours"].forEach(id=>{$(id).addEventListener("pointermove",showTip);$(id).addEventListener("pointerleave",()=>$("tip").hidden=true);});
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  statsRange=b.dataset.range;try{localStorage.setItem("panel-stats-range",statsRange);}catch{}renderStats();refreshStats(true);
}));

// ---- sidebar
function setSide(collapsed,focus){
  $("app").classList.toggle("side-collapsed",collapsed);
  try{localStorage.setItem("panel-side",collapsed?"collapsed":"");}catch{}
  if(focus)(collapsed?$("side-show"):$("side-hide")).focus();
}
try{setSide(localStorage.getItem("panel-side")==="collapsed");}catch{}
$("side-hide").addEventListener("click",()=>setSide(true,true));$("side-show").addEventListener("click",()=>setSide(false,true));

// ---- page chrome
function showPage(name){
  page=titles[name]?name:"models";
  document.querySelectorAll("section[data-page]").forEach(s=>s.hidden=s.dataset.page!==page);
  document.querySelectorAll("nav a").forEach(a=>a.dataset.page===page?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  document.querySelectorAll(".tools[data-for]").forEach(t=>t.hidden=t.dataset.for!==page);
  setText($("title"),titles[page]);closeMenu();$("now").hidden=page!=="models"||!$("now").textContent;
  if(page==="logs")refreshLog();
  if(page==="stats"){renderStats();refreshStats(true);}
  $("tip").hidden=true;
}
addEventListener("hashchange",()=>showPage(location.hash.slice(1)));
function status(text,kind=""){ $("status").hidden=!text;setText($("status-text"),text);$("status").dataset.state=kind;$("status-close").hidden=kind!=="completed"&&kind!=="failed"; }
$("status-close").addEventListener("click",()=>{dismissed=lastJob;status(idleText());});
function idleText(){ return !state?"正在读取状态…":""; }
function renderChrome(){
  const gw=state.gateway?.alive?(state.gateway.status==="ready"?"QQbot 已就绪":"QQbot 连接中"):"QQbot 未运行";
  // The running bot imported its code when it started; files changed since then need a restart to take effect.
  const stale=!!(state.gateway?.alive&&state.gateway.code_change?.stale),changed=state.gateway?.code_change?.changed||[];
  // The list marks the model in use, so the header only speaks up when QQbot is not ready or runs old code.
  setText($("now"),state.gateway?.alive&&state.gateway.status==="ready"?(stale?"QQbot 还在运行旧代码，到设置里重启后生效":""):gw);$("now").hidden=page!=="models"||!$("now").textContent;
  setText($("ollama-state"),state.ollama.online?"运行中":"未启动");$("start").hidden=!!state.ollama.online;setProp($("start"),"disabled",busy);
  // A count is only the live bot's: one left by a process that is gone says nothing.
  const answering=state.gateway?.alive&&Number.isInteger(state.gateway.active_answers)&&state.gateway.active_answers>0?state.gateway.active_answers:0;
  setText($("gateway-state"),gw.replace("QQbot ","")+(answering?`，正在回答 ${answering} 个`:"")+(stale?" · 代码已更新，重启后生效":""));
  $("gateway-state").classList.toggle("warn",stale);
  $("gateway-state").title=stale&&changed.length?`启动后改过：${changed.slice(0,8).join("、")}${changed.length>8?` 等 ${changed.length} 个文件`:""}`:"";setText($("ollama-url"),state.ollama.url||"—");setText($("config"),state.config_path||"var/models.json");
  const restartArmed=armedFor("restart","gateway");setText($("restart"),restartArmed?"确认重启":"重启");$("restart").classList.toggle("confirm",restartArmed);$("restart").classList.toggle("primary",stale&&!restartArmed);
  $("restart").title=restartArmed?"再点一次确认：QQbot 会断开几秒，按当前 .env 和代码重新启动":"按当前 .env 和代码重新启动 QQbot";setProp($("restart"),"disabled",busy||answering>0);
  setProp($("api-add"),"disabled",busy);setProp($("refresh"),"disabled",refreshing);setProp($("api-submit"),"disabled",busy);
}
function renderAll(){ if(!state)return;renderChrome();renderLocal();renderApis(); }
function jobText(j){
  if(j.state!=="running")return j.message;
  return {start:"正在启动 Ollama…",restart:"正在重启 QQbot…",warm:`正在加载 ${j.model}…`,switch:`正在切换到 ${j.model}，QQbot 会重启…`,api_switch:"正在切换接口，QQbot 会重启…",
    api_save:"正在保存接口…",api_delete:"正在删除接口…",api_balance:"正在查询余额…"}[j.action]||"正在处理…";
}
async function refresh(){
  if(refreshing)return;refreshing=true;
  try{
    const r=await fetch("/api/status").catch(()=>{throw Error(OFFLINE);}),data=await r.json();if(!r.ok)throw Error(data.error||"读取状态失败");
    const firstLoad=!state;
    state=data.status;job=data.job;busy=job?.state==="running";
    // A job that finished before this page opened is history, not news.
    if(firstLoad&&job&&!busy)dismissed=lastJob=JSON.stringify(job);
    if(!page)showPage(location.hash.slice(1));
    const signature=JSON.stringify(job);
    if(job&&signature!==lastJob){
      lastJob=signature;
      // Only the save this page submitted may close the dialog; a failed save keeps every field, including the key.
      if(pendingSave&&job.action==="api_save"&&!busy){
        pendingSave=false;
        if(job.state==="completed")closeDialog();else setText($("dialog-error"),job.message);
      }
    }
    if(job&&lastJob!==dismissed)status(jobText(job),job.state);else status(idleText());
    renderAll();
  }catch(e){status(e.message===OFFLINE?OFFLINE+"。":e.message+"。检查面板服务后刷新页面。","failed");}
  finally{refreshing=false;if(state)renderChrome();}
}
async function act(action,model){
  if(busy)return;busy=true;renderAll();status("正在提交…","running");
  try{
    const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Panel-Token":token},body:JSON.stringify({action,model})});
    const data=await r.json();if(!r.ok)throw Error(data.error||"提交失败");
    lastJob="";dismissed="";await refresh();
  }catch(e){
    busy=false;renderAll();
    if(pendingSave){pendingSave=false;setText($("dialog-error"),e.message);}
    status(e.message,"failed");
  }
}
$("search").addEventListener("input",()=>{$("groups").classList.toggle("searching",!!$("search").value);renderLocal();renderApis();});$("refresh").addEventListener("click",refresh);
$("api-add").addEventListener("click",()=>editApi());$("start").addEventListener("click",()=>act("start"));
$("restart").addEventListener("click",()=>{ if(armedFor("restart","gateway")){armed=null;act("restart");}else arm("restart","gateway"); });
refresh();setInterval(()=>{refresh();refreshLog();refreshStats();},3000);
</script>
</html>
